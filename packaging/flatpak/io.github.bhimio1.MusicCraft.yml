# Flatpak manifest for MusicCraft.
#
# This packages a binary that CI has already built (staged next to this file by the
# release workflow as ./musiccraft), which keeps the bundle build fast and offline.
# Flathub itself requires building from source; if you submit there later, replace
# the `sources` below with a source build using the rust-stable SDK extension and
# vendored crates (see docs/releasing.md).
#
# Local build, after copying target/release/musiccraft and the icon PNGs into this folder
# (the release workflow does this; see "Flatpak" in docs/releasing.md):
#   flatpak-builder --user --install-deps-from=flathub --force-clean build-dir \
#     io.github.bhimio1.MusicCraft.yml
app-id: io.github.bhimio1.MusicCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: musiccraft

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio output and input go through PulseAudio / PipeWire-Pulse.
  - --socket=pulseaudio
  # ALSA MIDI sequencer access for MIDI keyboards (midir).
  - --device=all
  # The sample browser walks the home folder and projects refer to samples by
  # path, so the app needs real home access. File dialogs go through the
  # desktop portal (org.freedesktop.portal.FileChooser), which needs no
  # permission.
  - --filesystem=home

modules:
  - name: musiccraft
    buildsystem: simple
    build-commands:
      - install -Dm755 musiccraft /app/bin/musiccraft
      # ONNX Runtime for stem splitting (packaging/onnxruntime/fetch.sh).
      - install -Dm755 libonnxruntime.so /app/lib/libonnxruntime.so
      - install -Dm644 ONNXRUNTIME-LICENSE.txt /app/share/licenses/io.github.bhimio1.MusicCraft/ONNXRUNTIME-LICENSE.txt
      - install -Dm644 io.github.bhimio1.MusicCraft.desktop /app/share/applications/io.github.bhimio1.MusicCraft.desktop
      - install -Dm644 io.github.bhimio1.MusicCraft.metainfo.xml /app/share/metainfo/io.github.bhimio1.MusicCraft.metainfo.xml
      - install -Dm644 musiccraft-128.png /app/share/icons/hicolor/128x128/apps/io.github.bhimio1.MusicCraft.png
      - install -Dm644 musiccraft-256.png /app/share/icons/hicolor/256x256/apps/io.github.bhimio1.MusicCraft.png
      - install -Dm644 musiccraft-512.png /app/share/icons/hicolor/512x512/apps/io.github.bhimio1.MusicCraft.png
    sources:
      - type: file
        path: musiccraft
      - type: file
        path: io.github.bhimio1.MusicCraft.desktop
      - type: file
        path: io.github.bhimio1.MusicCraft.metainfo.xml
      - type: file
        path: musiccraft-128.png
      - type: file
        path: musiccraft-256.png
      - type: file
        path: musiccraft-512.png
      - type: file
        path: libonnxruntime.so
      - type: file
        path: ONNXRUNTIME-LICENSE.txt
