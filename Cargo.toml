[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Its own workspace: see standalone/Cargo.toml. `vendor` holds patched
# third-party crates, used through `[patch]` below.
exclude = ["standalone", "vendor"]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
musiccraft-project = { path = "crates/musiccraft-project" }
musiccraft-commands = { path = "crates/musiccraft-commands" }
musiccraft-engine = { path = "crates/musiccraft-engine" }
musiccraft-dsp = { path = "crates/musiccraft-dsp" }
musiccraft-editors = { path = "crates/musiccraft-editors" }
musiccraft-plugin-editor = { path = "crates/musiccraft-plugin-editor" }
musiccraft-plugin-export = { path = "crates/musiccraft-plugin-export" }
musiccraft-ui = { path = "crates/musiccraft-ui" }
musiccraft-params = { path = "crates/musiccraft-params" }
musiccraft-meter = { path = "crates/musiccraft-meter" }
musiccraft-instruments = { path = "crates/musiccraft-instruments" }
musiccraft-antiserum = { path = "crates/musiccraft-antiserum" }
musiccraft-paths = { path = "crates/musiccraft-paths" }
musiccraft-samples = { path = "crates/musiccraft-samples" }
musiccraft-stems = { path = "crates/musiccraft-stems" }
musiccraft-demucs = { path = "crates/musiccraft-demucs" }
musiccraft-render = { path = "crates/musiccraft-render" }
musiccraft-audio = { path = "crates/musiccraft-audio" }
musiccraft-cli = { path = "crates/musiccraft-cli" }
musiccraft-mcp = { path = "crates/musiccraft-mcp" }
musiccraft-clap = { path = "crates/musiccraft-clap" }
musiccraft-formula = { path = "crates/musiccraft-formula" }
musiccraft-wavetables = { path = "crates/musiccraft-wavetables" }
musiccraft-patch = { path = "crates/musiccraft-patch" }
musiccraft-antiserum-presets = { path = "crates/musiccraft-antiserum-presets" }
musiccraft-flp = { path = "crates/musiccraft-flp" }
musiccraft-serum = { path = "crates/musiccraft-serum" }
musiccraft-plugin-window = { path = "crates/musiccraft-plugin-window" }
musiccraft-vst3 = { path = "crates/musiccraft-vst3" }
musiccraft-file-dialog = { path = "crates/musiccraft-file-dialog" }
cpal = "0.18"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serum preset import (docs/spec/serum-import.md): zlib for Serum 1, zstd for Serum 2.
miniz_oxide = "0.8"
ruzstd = "0.8"
hound = "3.5"
mp3lame-encoder = "0.2.5"
vorbis_rs = "0.5.6"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
midir = "0.11"
# Native file dialogs: the desktop portal on Linux (works inside the Flatpak),
# the system panels on macOS and Windows. Wayland parenting is a feature of
# musiccraft-file-dialog, so the plugins do not link libwayland.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# ONNX Runtime, loaded at run time (no build-time download); the GPU
# execution providers are tried in turn (docs/spec/stems.md). No `api-22`:
# with it ort turns on automatic device selection, which aborts on ONNX
# Runtime 1.22 (the version the packages ship).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "cuda", "rocm", "migraphx", "directml", "coreml", "webgpu"] }
egui = "0.36"
# nih-plug from GitHub, pinned (roadmap D2).
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# nih-plug with our fixes for clap-validator findings (vendor/nih_plug/PATCHES.md).
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih_plug" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
