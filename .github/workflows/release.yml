name: Release

# To make a release: Actions > Release > Run workflow, type a version (for example 0.2.0),
# and press the button. Nothing else to do:
#
#   1. checks the version is well formed and not already released,
#   2. builds every package with that version applied (Cargo.toml and Cargo.lock are bumped
#      inside each build, so the binaries and installers carry the right number),
#   3. installs and uninstalls the .msi and mounts the .dmg to check them,
#   4. only if everything passed: commits the version bump to the branch, tags it
#      v<version>, and publishes the GitHub release with checksums.
#
# Nothing is committed or tagged if any build fails. Untick "publish" for a dry run.
# The build jobs also run on pull requests that touch packaging (no bump, no publishing).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.2.0-beta.1 (a suffix makes it a pre-release)"
        required: true
        type: string
      publish:
        description: "Commit the bump, tag and publish (untick for a dry run: build and test only)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current=$(perl -ne 'if (/^\[workspace\.package\]/) { $f = 1; next } if (/^\[/) { $f = 0 } if ($f && /^version = "([^"]*)"/) { print "$1\n"; exit }' Cargo.toml)
          version=${INPUT_VERSION:-$current}
          version=${version#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Version::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
              echo "::error title=Branch::Run this workflow from a branch (usually main), not from a tag."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "::error title=Version::v$version has already been released. Pick a new version number."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing MusicCraft $version (current Cargo.toml: $current)" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Apply version
        shell: bash
        run: bash packaging/set-version.sh "$VERSION"
      - name: Build
        run: cargo build --release --locked -p musiccraft-app -p musiccraft-mcp
      - name: Fetch ONNX Runtime
        shell: bash
        run: bash packaging/onnxruntime/fetch.sh windows ort
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # MSI versions must be numeric (a.b.c), so drop any -prerelease suffix.
          $msiVersion = $env:VERSION.Split('-')[0]
          wix build -arch x64 `
            -d Version=$msiVersion `
            -d Exe=target\release\musiccraft.exe `
            -d Ort=ort `
            -d Icon=packaging\icons\musiccraft.ico `
            -o "dist\MusicCraft-$env:VERSION-windows-x64.msi" `
            packaging\windows\musiccraft.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Upgrade an older install in place, check everything landed, uninstall, check it is gone.
      - name: Test the MSI
        shell: pwsh
        run: |
          function Fail($msg) { Write-Output "::error title=MSI test::$msg"; exit 1 }
          $msiVersion = $env:VERSION.Split('-')[0]
          $msi = (Resolve-Path dist\*.msi).Path
          $old = "$env:RUNNER_TEMP\old.msi"
          wix build -arch x64 -d Version=0.0.1 -d Exe=target\release\musiccraft.exe -d Ort=ort -d Icon=packaging\icons\musiccraft.ico -o $old packaging\windows\musiccraft.wxs
          if ($LASTEXITCODE -ne 0) { Fail "could not build the old test package" }
          $p = Start-Process msiexec -ArgumentList "/i `"$old`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "installing the old version exited $($p.ExitCode)" }
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { $tail = (Get-Content install.log -Tail 40) -join '%0A'; Fail "install exited $($p.ExitCode)%0A$tail" }
          $entries = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'MusicCraft')
          if ($entries.Count -ne 1) { Fail "upgrade left $($entries.Count) MusicCraft entries in Apps & features" }
          if ($entries[0].DisplayVersion -ne $msiVersion) { Fail "installed version is $($entries[0].DisplayVersion), expected $msiVersion" }
          $dir = "$env:ProgramFiles\MusicCraft"
          if (-not (Test-Path "$dir\musiccraft.exe")) { Fail "musiccraft.exe missing from $dir" }
          if (-not (Test-Path "$dir\onnxruntime.dll")) { Fail "onnxruntime.dll missing from $dir" }
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\MusicCraft.lnk"
          if (-not (Test-Path $lnk)) { Fail "Start menu shortcut missing" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /norestart /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "uninstall exited $($p.ExitCode)" }
          if (Test-Path "$dir\musiccraft.exe") { Fail "program files left behind after uninstall" }
          if (Test-Path $lnk) { Fail "shortcut left behind after uninstall" }
          Write-Output "::notice title=MSI::upgrades in place, installs, and uninstalls cleanly"
      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "MusicCraft-$env:VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\musiccraft.exe $dir\
          Copy-Item ort\* $dir\
          # The MCP server, so an assistant (for example in CreativeCraft) can drive MusicCraft.
          Copy-Item target\release\musiccraft-mcp.exe $dir\
          $v = & "$dir\musiccraft-mcp.exe" --version
          if ($LASTEXITCODE -ne 0 -or $v -ne "musiccraft-mcp $env:VERSION") { Write-Output "::error title=Portable zip::musiccraft-mcp --version printed '$v'"; exit 1 }
          Copy-Item packaging\portable\README-windows.txt "$dir\README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-14
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Apply version
        run: bash packaging/set-version.sh "$VERSION"
      - name: Build both architectures
        run: |
          cargo build --release --locked -p musiccraft-app -p musiccraft-mcp --target aarch64-apple-darwin
          cargo build --release --locked -p musiccraft-app -p musiccraft-mcp --target x86_64-apple-darwin
          mkdir -p build
          for bin in musiccraft musiccraft-mcp; do
            lipo -create -output "build/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo -info "build/$bin"
          done
      - name: Fetch ONNX Runtime
        run: bash packaging/onnxruntime/fetch.sh macos ort
      - name: Build app bundle and DMG
        env:
          ORT_DIR: ort
        run: |
          mkdir -p dist
          bash packaging/macos/build-dmg.sh "$VERSION" build/musiccraft \
            packaging/icons/musiccraft-1024.png \
            "dist/MusicCraft-$VERSION-macos-universal.dmg"
      # The MCP server ships beside the disk image, the way the Craft apps ship their CLI, so
      # CreativeCraft installs it next to the app.
      - name: CLI zip
        run: |
          set -euo pipefail
          dir="MusicCraft-cli-$VERSION-macos-universal"
          mkdir -p "$dir"
          cp build/musiccraft-mcp "$dir/"
          codesign --force --sign - "$dir/musiccraft-mcp"
          v=$("$dir/musiccraft-mcp" --version)
          [ "$v" = "musiccraft-mcp $VERSION" ] || { echo "::error title=CLI zip::musiccraft-mcp --version printed '$v'"; exit 1; }
          cp packaging/portable/README-cli-macos.txt "$dir/README.txt"
          zip -qry "dist/$dir.zip" "$dir"
      # Mount it, check the app, the icon, the Applications shortcut, the signature and both
      # architectures, install by copying, detach.
      - name: Test the DMG
        run: |
          set -uo pipefail
          fail() { echo "::error title=DMG test::$1"; exit 1; }
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null || fail "hdiutil attach failed"
          app="$mnt/MusicCraft.app"
          [ -x "$app/Contents/MacOS/musiccraft" ] || fail "app executable missing"
          [ -f "$app/Contents/Resources/MusicCraft.icns" ] || fail "app icon missing"
          [ -f "$app/Contents/Frameworks/libonnxruntime.dylib" ] || fail "ONNX Runtime missing"
          [ "$(readlink "$mnt/Applications")" = "/Applications" ] || fail "Applications shortcut missing"
          out=$(codesign --verify --deep --strict "$app" 2>&1) || fail "signature does not verify: $out"
          archs=$(lipo -archs "$app/Contents/MacOS/musiccraft")
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) fail "not a universal binary ($archs)";; esac
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          [ "$plist_version" = "$VERSION" ] || fail "bundle version is $plist_version, expected $VERSION"
          cp -R "$app" /Applications/ || fail "copying to /Applications failed"
          hdiutil detach "$mnt" >/dev/null || fail "hdiutil detach failed"
          rm -rf /Applications/MusicCraft.app
          echo "::notice title=DMG::mounts, installs by drag and drop, signature verifies, universal ($archs)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  # Built on the oldest supported Ubuntu runner so the binary runs on older distros.
  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Apply version
        run: bash packaging/set-version.sh "$VERSION"
      - name: Build
        run: cargo build --release --locked -p musiccraft-app -p musiccraft-mcp -p musiccraft-cli
      - name: Fetch ONNX Runtime
        run: bash packaging/onnxruntime/fetch.sh linux ort
      # The shipped runtime loads and the stem splitter sees it.
      - name: Check ONNX Runtime
        run: |
          out=$(MUSICCRAFT_ONNXRUNTIME=ort/libonnxruntime.so target/release/musiccraft-cli run sample.stems_info)
          echo "$out"
          echo "$out" | grep -q "^ok: ONNX Runtime[ 0-9.]* at " || { echo "::error title=ONNX Runtime::the bundled runtime did not load"; exit 1; }
      - name: Portable tarball
        run: |
          mkdir -p dist binary
          dir="MusicCraft-$VERSION-linux-x86_64-portable"
          mkdir -p "$dir"
          install -m755 target/release/musiccraft "$dir/musiccraft"
          strip "$dir/musiccraft"
          # The MCP server, so an assistant (for example in CreativeCraft) can drive MusicCraft.
          install -m755 target/release/musiccraft-mcp "$dir/musiccraft-mcp"
          strip "$dir/musiccraft-mcp"
          v=$("$dir/musiccraft-mcp" --version)
          [ "$v" = "musiccraft-mcp $VERSION" ] || { echo "::error title=Portable tarball::musiccraft-mcp --version printed '$v'"; exit 1; }
          cp packaging/portable/README-linux.txt "$dir/README.txt"
          cp ort/libonnxruntime.so ort/ONNXRUNTIME-LICENSE.txt "$dir/"
          cp packaging/icons/musiccraft-512.png "$dir/musiccraft.png"
          tar -czf "dist/$dir.tar.gz" "$dir"
          # Stripped binary and ONNX Runtime for the Flatpak job.
          cp "$dir/musiccraft" binary/musiccraft
          cp ort/libonnxruntime.so ort/ONNXRUNTIME-LICENSE.txt binary/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: binary/*
          if-no-files-found: error

  flatpak:
    needs: [prepare, linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APP_ID: io.github.bhimio1.MusicCraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: linux-binary
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Stage sources
        run: |
          mkdir -p build-src dist
          cp linux-binary/musiccraft build-src/musiccraft
          cp linux-binary/libonnxruntime.so linux-binary/ONNXRUNTIME-LICENSE.txt build-src/
          cp packaging/flatpak/$APP_ID.yml packaging/flatpak/$APP_ID.desktop build-src/
          cp packaging/icons/musiccraft-128.png packaging/icons/musiccraft-256.png packaging/icons/musiccraft-512.png build-src/
          sed -e "s/@VERSION@/$VERSION/" -e "s/@DATE@/$(date -u +%F)/" \
            packaging/flatpak/$APP_ID.metainfo.xml.in > build-src/$APP_ID.metainfo.xml
      - name: Build
        working-directory: build-src
        run: |
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub \
            --force-clean --repo=repo build-dir $APP_ID.yml
      - name: Check the binary's libraries resolve inside the runtime
        working-directory: build-src
        run: |
          flatpak-builder --run build-dir $APP_ID.yml ldd /app/bin/musiccraft | tee ldd.txt
          if grep -q "not found" ldd.txt; then
            echo "::error::musiccraft has unresolved shared libraries in the Flatpak runtime"
            exit 1
          fi
      - name: Bundle
        working-directory: build-src
        run: |
          flatpak build-bundle repo "../dist/MusicCraft-$VERSION-linux-x86_64.flatpak" $APP_ID
      - uses: actions/upload-artifact@v4
        with:
          name: dist-flatpak
          path: dist/*
          if-no-files-found: error

  # MusicCraft's effects and instruments as CLAP and VST3 plugins for other DAWs
  # (docs/spec/plugin-export.md), one zip per system with install notes.
  plugins:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
          - os: macos-14
            name: macos-universal
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev
      - name: Add Rust targets (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Apply version
        shell: bash
        run: bash packaging/set-version.sh "$VERSION"
      - name: Bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo xtask bundle-universal --release --locked
          else
            cargo xtask bundle --release --locked
          fi
      # Every bundle is where a DAW expects it, with the right binary inside.
      - name: Check the bundles
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error title=Plugin bundles::$1"; exit 1; }
          cd target/bundled
          for name in "MusicCraft Effects" "MusicCraft Instruments"; do
            [ -e "$name.clap" ] || fail "$name.clap missing"
            [ -d "$name.vst3" ] || fail "$name.vst3 missing"
            case "$RUNNER_OS" in
              Linux)
                nm -D --defined-only "$name.clap" | grep -q " clap_entry$" || fail "$name.clap exports no clap_entry"
                [ -f "$name.vst3/Contents/x86_64-linux/$name.so" ] || fail "$name.vst3 has no Linux binary"
                ;;
              Windows)
                [ -f "$name.vst3/Contents/x86_64-win/$name.vst3" ] || fail "$name.vst3 has no Windows binary"
                ;;
              macOS)
                for bundle in "$name.clap" "$name.vst3"; do
                  binary="$bundle/Contents/MacOS/$name"
                  archs=$(lipo -archs "$binary") || fail "$binary missing"
                  case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) fail "$bundle is not universal ($archs)";; esac
                  # Ad-hoc signature: Apple Silicon refuses to load unsigned code.
                  codesign --force --deep --sign - "$bundle"
                  codesign --verify --deep --strict "$bundle" || fail "$bundle signature does not verify"
                done
                ;;
            esac
          done
          echo "::notice title=Plugin bundles::${{ matrix.name }}: both bundles in CLAP and VST3"
      - name: Zip
        shell: bash
        run: |
          set -euo pipefail
          dir="MusicCraft-Plugins-$VERSION-${{ matrix.name }}"
          mkdir -p "$dir" dist
          cp -R target/bundled/*.clap target/bundled/*.vst3 "$dir/"
          cp packaging/portable/README-plugins.txt "$dir/README.txt"
          cp LICENSE "$dir/LICENSE.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -Command "Compress-Archive -Path '$dir' -DestinationPath 'dist/$dir.zip'"
          else
            # -y keeps macOS bundles' symlinks as links.
            zip -qry "dist/$dir.zip" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-plugins-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Runs only when every build and test above passed.
  release:
    name: Commit, tag and publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [prepare, windows, macos, linux, flatpak, plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Commit the version bump
        id: bump
        run: |
          set -euo pipefail
          bash packaging/set-version.sh "$VERSION"
          if git diff --quiet; then
            echo "Cargo.toml was already at $VERSION; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$VERSION"
            if ! git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "::error title=Push::Could not push the version bump to '$BRANCH'. Either the branch moved while the release was building (run the release again), or the branch is protected and does not allow the Actions bot to push (see docs/releasing.md)."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create the release
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.bump.outputs.sha }}" \
            --title "MusicCraft $VERSION" \
            --generate-notes \
            --notes "These builds are not code-signed, so Windows SmartScreen and macOS Gatekeeper will warn on first launch. Verify downloads against SHA256SUMS.txt." \
            "${flags[@]}"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
